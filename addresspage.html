<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saltyre Map</title>
    <link rel="icon" type="image/png" href="assets/images/favicon.png">
    <link rel="stylesheet" href="style.css">
  </head>
  <body class="saltyre-page address-page">
    <header>
      <h1 class="banner-heading">
        <img class="site-banner" src="assets/images/saltyrerockbanner.png" alt="Saltyre Rock">
      </h1>
    </header>
    <main class="address-map-layout">
      <section class="map-page-image-area" aria-label="Map, address, and return link">
        <img class="map-page-image" src="assets/images/tropicsaltyre1.jpg" alt="Map of Saltyre">
        <address class="map-address">
          ADDRESS:<br>
          Pentracentum port,<br>
          Saltyre Island,<br>
          The Salt Sea,<br>
          Kraizen-dome,<br>
          Unmerciey
        </address>
        <div class="enter-link">
          <a class="enter-button" href="saltyre.html">BACK TO SALTYRE</a>
        </div>
      </section>
    </main>
  </body>
</html>
