<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saltyre</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
  </head>
  <body class="saltyre-page">
    <header>
      <h1>
        <img src="peacedove1left.jpg" alt="Peace dove" width="80" height="80">
        SALTYRE ROCK
        <img src="peacedove1.jpg" alt="Peace dove" width="80" height="80">
      </h1>
      <h2>The beauty of the island in pictures</h2>
      <p class="island-description">
        les chalets de mes grands-mères
      </p>
      <img class="castle-image" src="saltyrechalets1.jpg" alt="Chalets at Saltyre">
      <p class="island-description">
        Times gone by
      </p>
      <img class="castle-image" src="saltyresea1.jpg" alt="Sea around Saltyre">
      <p class="island-description">
        Calm flowing streams
      </p>
      <img class="castle-image" src="saltyrestream1.jpg" alt="Calm stream at Saltyre">
      <div class="enter-link">
        <button class="enter-button" type="button" id="map-open">SALTYRE MAP</button>
      </div>
      <dialog class="map-dialog" id="map-dialog" aria-labelledby="map-dialog-title">
        <h2 id="map-dialog-title" class="visually-hidden">Map of Saltyre</h2>
        <button class="map-dialog-close" type="button" aria-label="Close map">&times;</button>
        <div class="map-dialog-content">
          <address class="map-address">
            Saltyre Island,<br>
            The Salt Sea,<br>
            Kraizen-dome,<br>
            Unmerciey
          </address>
          <img src="tropicsaltyre1.jpg" alt="Map of Saltyre">
        </div>
      </dialog>
      <h2>Any questions? Email tomsaltyre7@yahoo.com</h2>
    </header>

    <main>
      <div class="enter-link">
        <a class="enter-button" href="index.html">BACK TO THE BEACH</a>
      </div>
    </main>
  </body>
</html>
